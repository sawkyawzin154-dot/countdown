<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>နှစ်ကုန်ရန် ကျန်ချိန်</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070914;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--text:#eef1ff;--muted:#9aa3c7;--a:#22d3ee;--b:#a855f7;--c:#f43f5e;--track:rgba(255,255,255,.1);--blob:.55;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f1fb;--card:rgba(255,255,255,.7);--line:rgba(60,40,120,.15);--text:#1a1533;--muted:#5d5880;--a:#0891b2;--b:#7c3aed;--c:#e11d48;--track:rgba(60,40,120,.12);--blob:.28;color-scheme:light}}
:root[data-theme="light"]{--bg:#f3f1fb;--card:rgba(255,255,255,.7);--line:rgba(60,40,120,.15);--text:#1a1533;--muted:#5d5880;--a:#0891b2;--b:#7c3aed;--c:#e11d48;--track:rgba(60,40,120,.12);--blob:.28;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans Myanmar',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;line-height:1.8}
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:var(--blob);animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--a);top:-20vmax;left:-15vmax}
.aurora i:nth-child(2){background:var(--b);bottom:-25vmax;right:-15vmax;animation-duration:28s}
.aurora i:nth-child(3){background:var(--c);top:30%;left:35%;width:35vmax;height:35vmax;animation-duration:34s;opacity:calc(var(--blob)*.6)}
@keyframes drift{to{transform:translate(12vmax,8vmax) scale(1.25) rotate(40deg)}}
canvas{position:fixed;inset:0;z-index:1;width:100%;height:100%}
main{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:28px 16px 40px}
.tag{display:block;width:max-content;margin:0 auto 10px;padding:2px 14px;border:1px solid var(--line);background:var(--card);border-radius:99px;font-size:.8rem;color:var(--muted);backdrop-filter:blur(8px)}
.tag b{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:8px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.2;transform:scale(1.6)}}
h1{font-size:1.7rem;margin:0;text-align:center;background:linear-gradient(90deg,var(--a),var(--b),var(--c),var(--a));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite}
@keyframes flow{to{background-position:300% 0}}
.sub{text-align:center;color:var(--muted);margin:2px 0 24px;font-size:.92rem}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.box{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 8px 12px;text-align:center;backdrop-filter:blur(12px);opacity:0;transform:translateY(24px) scale(.95);animation:rise .8s cubic-bezier(.2,.9,.3,1.2) forwards}
.box:nth-child(2){animation-delay:.12s}.box:nth-child(3){animation-delay:.24s}.box:nth-child(4){animation-delay:.36s}
@keyframes rise{to{opacity:1;transform:none}}
.ring{position:relative;width:132px;height:132px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .t{stroke:var(--track)}
.ring .p{stroke:url(#g);stroke-dasharray:314.16;stroke-dashoffset:314.16;filter:drop-shadow(0 0 6px var(--a));transition:stroke-dashoffset .9s cubic-bezier(.3,.8,.3,1)}
.num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Orbitron','Noto Sans Myanmar',sans-serif;font-weight:800;font-size:2.2rem;text-shadow:0 0 18px var(--a)}
.lbl{color:var(--muted);font-size:.9rem;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:14px;backdrop-filter:blur(12px)}
.row{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem}
.row b{color:var(--text);font-family:'Orbitron',sans-serif}
.bar{height:14px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:10px}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--a),var(--b),var(--c));position:relative;transition:width 1s}
.fill::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.4s infinite}
@keyframes shine{to{transform:translateX(100%)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-family:'Orbitron',sans-serif;font-size:1.35rem}
.stats span{color:var(--muted);font-size:.8rem}
.msg{text-align:center;color:var(--muted);margin-top:18px;font-size:.92rem;min-height:1.8em}
.hint{text-align:center;color:var(--muted);font-size:.78rem;opacity:.7}
.flash{display:none!important}
canvas{display:none;pointer-events:none}
*{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.aurora i{filter:none!important;animation:none!important;opacity:.22!important;background:radial-gradient(circle,var(--a),transparent 68%)!important}
.aurora i:nth-child(2){background:radial-gradient(circle,var(--b),transparent 68%)!important}
.aurora i:nth-child(3){background:radial-gradient(circle,var(--c),transparent 68%)!important}
h1{animation:none!important}
.fill::after{display:none}
.ring .p{filter:none!important}
.num{text-shadow:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.box{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<canvas id="cv"></canvas>
<div class="flash" id="flash"></div>
<main>
  <span class="tag"><b></b>LIVE</span>
  <h1 id="title">နှစ်ကုန်ရန် ကျန်ချိန်</h1>
  <p class="sub" id="sub"></p>
  <svg width="0" height="0" style="position:absolute"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#f43f5e"/></linearGradient></defs></svg>
  <div class="grid" id="grid"></div>
  <div class="card">
    <div class="row"><span>ဒီနှစ် ကုန်ဆုံးပြီး</span><b id="pct">0%</b></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>
  <div class="card stats">
    <div><b id="wk">0</b><span>ရက်သတ္တပတ်</span></div>
    <div><b id="we">0</b><span>စနေ၊တနင်္ဂနွေ</span></div>
    <div><b id="hr">0</b><span>စုစုပေါင်းနာရီ</span></div>
  </div>
  <p class="msg" id="msg"></p>
  
</main>
<script>
(function(){
  var year=new Date().getFullYear(), start=new Date(year,0,1), end=new Date(year+1,0,1);
  var $=function(i){return document.getElementById(i)};
  var mm="၀၁၂၃၄၅၆၇၈၉";
  function my(n){return String(n).replace(/\d/g,function(c){return mm[c]})}
  $("title").textContent=my(year)+" ပြီးဆုံးရန် ကျန်ချိန်";
  $("sub").textContent=my(year+1)+" ဇန်နဝါရီ ၁ ရက် အထိ";

  // countdown boxes
  var units=[["d","ရက်",365],["h","နာရီ",24],["m","မိနစ်",60],["s","စက္ကန့်",60]];
  $("grid").innerHTML=units.map(function(u){
    return '<div class="box"><div class="ring"><svg viewBox="0 0 120 120"><circle class="t" cx="60" cy="60" r="50"/><circle class="p" id="r'+u[0]+'" cx="60" cy="60" r="50"/></svg><div class="num" id="'+u[0]+'">0</div></div><div class="lbl">'+u[1]+'</div></div>';
  }).join("");
  var last={};
  function setU(k,val,max){
    var el=$(k);
    if(last[k]!==val){
      el.textContent=my(val);
      if(last[k]!==undefined&&el.animate)el.animate([{transform:"scale(1.35)",opacity:.4},{transform:"scale(1)",opacity:1}],{duration:380,easing:"cubic-bezier(.2,.9,.3,1.4)"});
      last[k]=val;
    }
    $("r"+k).style.strokeDashoffset=314.16*(1-val/max);
  }
  var msgs=["အချိန်ကို တန်ဖိုးရှိရှိ သုံးကြစို့ ⏳","ဒီနှစ်ရည်မှန်းချက်တွေ ပြီးအောင် တွန်းလိုက်! 🚀","တစ်စက္ကန့်ချင်း တိုးတက်နေတယ် 🔥","နှစ်သစ် ရောက်ခါနီးပြီ ✨"];
  var mi=0,mt=0;
  var done=false;
  function tick(){
    var now=new Date(), diff=end-now;
    if(diff<=0){
      if(!done){done=true;["d","h","m","s"].forEach(function(k){setU(k,0,1)});$("msg").textContent="🎉 မင်္ဂလာရှိသော နှစ်သစ်ကူးပါစေ!";finale()}
      return;
    }
    var sec=Math.floor(diff/1000);
    setU("d",Math.floor(sec/86400),365);
    setU("h",Math.floor(sec%86400/3600),24);
    setU("m",Math.floor(sec%3600/60),60);
    setU("s",sec%60,60);
    if(sec%60===0&&sec>0)strike();
    var pct=(now-start)/(end-start)*100;
    $("pct").textContent=my(pct.toFixed(2))+"%";
    $("fill").style.width=pct+"%";
    var days=Math.ceil(diff/86400000);
    $("wk").textContent=my(Math.floor(days/7));
    var we=0;
    for(var i=0;i<days;i++){var w=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i).getDay();if(w===0||w===6)we++}
    $("we").textContent=my(we);
    $("hr").textContent=my(Math.floor(sec/3600).toLocaleString("en-US"));
    if(++mt%8===0){mi=(mi+1)%msgs.length}
    if(!done)$("msg").textContent=msgs[mi];
  }
  tick();setInterval(tick,1000);
  if(location.hash==="#test")setTimeout(finale,800);

  // canvas: particle network + sparks
  var cv=$("cv"),ctx=cv.getContext("2d"),W,H,dpr=Math.min(devicePixelRatio||1,2);
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var pts=[],sparks=[],mouse={x:-999,y:-999};
  function resize(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    var n=Math.min(70,Math.floor(W*H/14000));pts=[];
    for(var i=0;i<n;i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5})}
  resize();addEventListener("resize",resize);
  function col(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
  var ca=col("--a"),cb=col("--b");
  matchMedia("(prefers-color-scheme: dark)").addEventListener&&matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){setTimeout(function(){ca=col("--a");cb=col("--b")},50)});
  function burst(x,y,n,hues){
    for(var i=0;i<n;i++){var a=Math.random()*6.283,s=1+Math.random()*4.5;
      sparks.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,h:hues?hues[i%hues.length]:Math.floor(Math.random()*360)})}
  }
  var fwOn=false;
  function fwLoop(){
    ctx.clearRect(0,0,W,H);
    for(var k=sparks.length-1;k>=0;k--){
      var s=sparks[k];s.x+=s.vx;s.y+=s.vy;s.vy+=.06;s.vx*=.985;s.l-=.016;
      if(s.l<=0){sparks.splice(k,1);continue}
      ctx.globalAlpha=s.l;ctx.fillStyle="hsl("+s.h+",95%,65%)";ctx.beginPath();ctx.arc(s.x,s.y,2.4*s.l+.4,0,6.283);ctx.fill();
    }
    ctx.globalAlpha=1;
    if(sparks.length||fwOn)requestAnimationFrame(fwLoop);else cv.style.display="none";
  }
  function finale(){
    if(reduce)return;
    cv.style.display="block";fwOn=true;fwLoop();
    var c=0;var iv=setInterval(function(){burst(Math.random()*W,Math.random()*H*.6,40);if(++c>20){clearInterval(iv);fwOn=false}},400);
  }
  addEventListener("pointermove",function(e){mouse.x=e.clientX;mouse.y=e.clientY});
  
  addEventListener("pointerleave",function(){mouse.x=mouse.y=-999});
  // storm: rain + lightning
  var rain=[],bolts=[],nextAt=performance.now()+1500;
  function makeBolt(x,y,ang,len,w,segs,depth){
    var steps=Math.floor(len/20),cx=x,cy=y;
    for(var i=0;i<steps;i++){
      var a=ang+(Math.random()-.5)*1.1,nx=cx+Math.cos(a)*20,ny=cy+Math.sin(a)*20;
      segs.push([cx,cy,nx,ny,w]);
      if(depth<2&&Math.random()<.12)makeBolt(nx,ny,a+(Math.random()<.5?-.7:.7),len*.4,w*.55,segs,depth+1);
      cx=nx;cy=ny;
    }
  }
  function strike(x){
    return;
    if(typeof x!=="number")x=W*(.15+Math.random()*.7);
    var segs=[];makeBolt(x,-10,Math.PI/2,H*(.55+Math.random()*.4),3.2,segs,0);
    bolts.push({segs:segs,life:1});
    var f=$("flash");
    if(f.animate)f.animate([{opacity:.8},{opacity:.15},{opacity:.55},{opacity:0}],{duration:650,easing:"ease-out"});
    var m=document.querySelector("main");
    if(m.animate)m.animate([{transform:"translate(0,0)"},{transform:"translate(-5px,3px)"},{transform:"translate(5px,-3px)"},{transform:"translate(-3px,2px)"},{transform:"translate(0,0)"}],{duration:380});
    if(Math.random()<.4)setTimeout(function(){strike(x+(Math.random()-.5)*80)},140+Math.random()*120);
  }
  function frame(){
    ctx.clearRect(0,0,W,H);
    var want=Math.min(170,Math.floor(W*H/9000));
    while(rain.length<want)rain.push({x:Math.random()*W,y:Math.random()*H,l:10+Math.random()*14,v:12+Math.random()*10});
    ctx.strokeStyle=ca;ctx.lineWidth=1;ctx.globalAlpha=.3;ctx.beginPath();
    for(var r=0;r<rain.length;r++){
      var d0=rain[r];
      ctx.moveTo(d0.x,d0.y);ctx.lineTo(d0.x-d0.l*.25,d0.y+d0.l);
      if(!reduce){d0.y+=d0.v;d0.x-=d0.v*.25}
      if(d0.y>H){d0.y=-20;d0.x=Math.random()*(W+120)}
    }
    ctx.stroke();
    if(!reduce&&performance.now()>nextAt){strike();nextAt=performance.now()+3000+Math.random()*6000}
    for(var b=bolts.length-1;b>=0;b--){
      var bo=bolts[b];bo.life-=.03;
      if(bo.life<=0){bolts.splice(b,1);continue}
      var al=bo.life>.6?1:bo.life*(Math.random()>.3?1:.3);
      ctx.globalAlpha=al;ctx.strokeStyle="#eef5ff";ctx.shadowColor="#8fb8ff";ctx.shadowBlur=22;ctx.lineCap="round";
      for(var s0=0;s0<bo.segs.length;s0++){var sg=bo.segs[s0];ctx.lineWidth=sg[4];ctx.beginPath();ctx.moveTo(sg[0],sg[1]);ctx.lineTo(sg[2],sg[3]);ctx.stroke()}
      ctx.shadowBlur=0;
    }
    ctx.globalAlpha=1;
    for(var i=0;i<pts.length;i++){
      var p=pts[i];
      if(!reduce){p.x+=p.vx;p.y+=p.vy}
      if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      var dx=mouse.x-p.x,dy=mouse.y-p.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<140&&!reduce){p.x+=dx*.012;p.y+=dy*.012}
      ctx.fillStyle=ca;ctx.globalAlpha=.8;ctx.beginPath();ctx.arc(p.x,p.y,1.8,0,6.283);ctx.fill();
      for(var j=i+1;j<pts.length;j++){
        var q=pts[j],ex=p.x-q.x,ey=p.y-q.y,dd=ex*ex+ey*ey;
        if(dd<12100){ctx.globalAlpha=(1-dd/12100)*.35;ctx.strokeStyle=cb;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}
      }
      if(d<140){ctx.globalAlpha=(1-d/140)*.7;ctx.strokeStyle=ca;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(mouse.x,mouse.y);ctx.stroke()}
    }
    for(var k=sparks.length-1;k>=0;k--){
      var s=sparks[k];s.x+=s.vx;s.y+=s.vy;s.vy+=.06;s.vx*=.985;s.l-=.016;
      if(s.l<=0){sparks.splice(k,1);continue}
      ctx.globalAlpha=s.l;ctx.fillStyle="hsl("+s.h+",95%,65%)";ctx.beginPath();ctx.arc(s.x,s.y,2.4*s.l+.4,0,6.283);ctx.fill();
    }
    ctx.globalAlpha=1;
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
